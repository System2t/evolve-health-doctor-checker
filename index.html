<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolve Health — Provider Availability</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #0f6b5e;
            --green-bg: #e8f5f0;
            --red: #c4432b;
            --red-bg: #fdecea;
            --amber: #96793e;
            --amber-bg: #fef6e4;
            --blue: #2d6a9f;
            --blue-bg: #e8f0f8;
            --text: #1a2332;
            --text-secondary: #5a6a7e;
            --border: #e2e7ed;
            --bg: #f7f8fa;
            --white: #ffffff;
            --header-h: 48px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            height: var(--header-h);
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        header img {
            height: 30px;
            width: 30px;
            border-radius: 6px;
        }

        header h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        header .scan-info {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
        }

        header .scan-info span { white-space: nowrap; }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 20px 0;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-family: 'Open Sans', sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.1;
        }

        .stat-card .value.green { color: var(--green); }
        .stat-card .value.red { color: var(--red); }
        .stat-card .value.amber { color: var(--amber); }
        .stat-card .value.blue { color: var(--blue); }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 0 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--white);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover { border-color: var(--text-secondary); color: var(--text); }
        .filter-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

        .search-box {
            margin-left: auto;
            position: relative;
        }

        .search-box input {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            padding: 7px 12px 7px 32px;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 220px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-box input:focus { border-color: var(--blue); }

        .search-box::before {
            content: '⌕';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* Source tabs */
        .source-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
        }

        .source-tab {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-bottom: none;
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.15s;
            margin-bottom: -1px;
            position: relative;
            z-index: 1;
        }

        .source-tab:hover { color: var(--text); }
        .source-tab.active {
            background: var(--white);
            color: var(--text);
            font-weight: 600;
            z-index: 2;
        }

        /* Table */
        .table-wrap {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 0 10px 10px 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        thead th:hover { color: var(--text); }
        thead th .sort-arrow { font-size: 10px; margin-left: 3px; opacity: 0.4; }
        thead th.sorted .sort-arrow { opacity: 1; }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }
        tbody tr.has-gap { background: #fffbf5; }
        tbody tr.has-gap:hover { background: #fff6eb; }

        td {
            padding: 10px 14px;
            vertical-align: top;
        }

        td.provider-name {
            font-weight: 500;
            white-space: nowrap;
        }

        td.provider-name a {
            color: var(--text);
            text-decoration: none;
        }

        td.provider-name a:hover { color: var(--blue); text-decoration: underline; }

        /* Status badges */
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .badge.available { background: var(--green-bg); color: var(--green); }
        .badge.partial { background: var(--amber-bg); color: var(--amber); }
        .badge.no-availability { background: var(--red-bg); color: var(--red); }
        .badge.error { background: var(--amber-bg); color: var(--amber); }
        .badge.not-listed { background: #f0f0f0; color: #888; }

        /* Holly location pills */
        .holly-locations {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .loc-pill {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 3px;
            white-space: nowrap;
            cursor: default;
        }

        .loc-pill.ok { background: var(--green-bg); color: var(--green); }
        .loc-pill.none { background: var(--red-bg); color: var(--red); }

        .loc-pill .loc-detail {
            font-weight: 400;
            opacity: 0.8;
            margin-left: 2px;
        }

        /* Zocdoc cell */
        .zocdoc-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zocdoc-info .slots {
            font-family: 'Open Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
        }

        .zocdoc-info .slots.green { color: var(--green); }
        .zocdoc-info .slots.red { color: var(--red); }

        .zocdoc-info .meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .zocdoc-link {
            font-size: 11px;
            color: var(--blue);
            text-decoration: none;
        }

        .zocdoc-link:hover { text-decoration: underline; }

        /* Holly summary cell */
        .holly-summary {
            font-size: 12px;
        }

        .holly-summary .count {
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
        }

        .holly-summary .count.green { color: var(--green); }
        .holly-summary .count.amber { color: var(--amber); }
        .holly-summary .count.red { color: var(--red); }

        /* Expand row */
        .expand-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            padding: 0 4px;
            transition: transform 0.2s;
        }

        .expand-btn.open { transform: rotate(90deg); }

        .detail-row td {
            padding: 0 14px 12px 42px;
            background: #fafbfc;
        }

        .detail-row table {
            font-size: 12px;
            margin: 0;
        }

        .detail-row table td {
            padding: 4px 10px;
            background: transparent;
        }

        .detail-row table th {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 4px 10px;
            background: transparent;
            cursor: default;
        }

        /* No data message */
        .no-data {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }

        .no-data h3 {
            font-family: 'Open Sans', sans-serif;
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .search-box { margin-left: 0; width: 100%; }
            .search-box input { width: 100%; }
            table { font-size: 12px; }
            td, thead th { padding: 8px 10px; }
            .holly-locations { gap: 3px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <img src="https://corporate.healthevolves.com/wp-content/uploads/2024/11/evolve-logo-square-e-150x150.png" alt="Evolve Health">
            <h1>Provider Availability Dashboard</h1>
            <div class="scan-info">
                <span id="zocdoc-scan-time"></span>
                <span id="holly-scan-time"></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="stats-row" id="stats-row"></div>

        <div class="toolbar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="all-good">All Good</button>
            <button class="filter-btn" data-filter="has-gaps">Has Gaps</button>
            <button class="filter-btn" data-filter="no-availability">No Availability</button>
            <button class="filter-btn" data-filter="errors">Errors</button>
            <div class="search-box">
                <input type="text" id="search" placeholder="Search providers...">
            </div>
        </div>

        <div class="source-tabs">
            <div class="source-tab active" data-view="holly">Holly</div>
            <div class="source-tab" data-view="zocdoc">Zocdoc</div>
        </div>

        <div class="table-wrap">
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="loading">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    (function() {
        // --- State ---
        let zocdocData = null;
        let hollyData = null;
        let mergedDoctors = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let currentView = 'holly';
        let sortCol = 'status';
        let sortAsc = false;

        // Phone → Office name mapping (loaded from data/phone_to_office.json)
        let phoneToOffice = {};

        // --- Data Loading ---
        async function loadData() {
            const [zRes, hRes, pRes] = await Promise.allSettled([
                fetch('data/availability.json').then(r => r.ok ? r.json() : null),
                fetch('data/holly_availability.json').then(r => r.ok ? r.json() : null),
                fetch('data/phone_to_office.json').then(r => r.ok ? r.json() : {})
            ]);

            zocdocData = zRes.status === 'fulfilled' ? zRes.value : null;
            hollyData = hRes.status === 'fulfilled' ? hRes.value : null;
            phoneToOffice = pRes.status === 'fulfilled' ? (pRes.value || {}) : {};

            if (!zocdocData && !hollyData) {
                document.getElementById('table-body').innerHTML =
                    '<tr><td colspan="6" class="no-data"><h3>No Data</h3>Run the Zocdoc or Holly checker to populate the dashboard.</td></tr>';
                return;
            }

            updateScanTimes();
            mergedDoctors = mergeDoctors();
            render();
        }

        function updateScanTimes() {
            const zEl = document.getElementById('zocdoc-scan-time');
            const hEl = document.getElementById('holly-scan-time');
            if (zocdocData && (zocdocData.scan_date || (zocdocData.meta && zocdocData.meta.generated))) {
                const d = new Date(zocdocData.scan_date || zocdocData.meta.generated);
                zEl.textContent = 'Zocdoc: ' + formatDateTime(d);
            }
            if (hollyData && hollyData.scan_date) {
                const d = new Date(hollyData.scan_date);
                hEl.textContent = 'Holly: ' + formatDateTime(d);
            }
        }

        function formatDateTime(d) {
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        // --- Name Normalization ---
        function normalizeName(name) {
            let n = name.toLowerCase().trim();
            ['dr. ', 'dr ', 'doctor '].forEach(p => { if (n.startsWith(p)) n = n.slice(p.length); });
            [', dpm', ', md', ', do', ', pt', ', dpt', ', pa-c', ', pa', ', arnp', ', np',
             ' dpm', ' md', ' do', ' pt', ' dpt', ' pa-c', ' pa', ' arnp', ' np'].forEach(s => {
                if (n.endsWith(s)) n = n.slice(0, -s.length);
            });
            return n.trim();
        }

        // --- Merge Logic ---
        function mergeDoctors() {
            const byNorm = {};

            // Process Zocdoc data
            if (zocdocData && zocdocData.doctors) {
                zocdocData.doctors.forEach(p => {
                    const name = p.name || '';
                    const norm = normalizeName(name);
                    if (!norm) return;
                    if (!byNorm[norm]) byNorm[norm] = { name: name, zocdoc: null, holly: null };

                    // Determine status from has_availability field
                    let status = 'no_availability';
                    if (p.error) status = 'error';
                    else if (p.has_availability) status = 'available';

                    // next_availability is an object {locationId: dateStr} — find earliest
                    let nextAvail = null;
                    if (p.next_availability && typeof p.next_availability === 'object') {
                        const dates = Object.values(p.next_availability).filter(Boolean).sort();
                        if (dates.length > 0) nextAvail = dates[0].split('T')[0];
                    }

                    byNorm[norm].zocdoc = {
                        name: name,
                        url: p.url || '',
                        status: status,
                        open_slots: p.total_slots != null ? p.total_slots : null,
                        next_available: nextAvail,
                        error: p.error || null,
                        locations: p.locations || [],
                        locations_total: p.locations_total || 0,
                        locations_available: p.locations_available || 0,
                    };

                    // Upgrade status to 'partial' if some locations have gaps
                    if (!p.error && p.locations && p.locations.length > 1) {
                        const availLocs = p.locations.filter(l => l.has_availability).length;
                        if (availLocs > 0 && availLocs < p.locations.length) {
                            byNorm[norm].zocdoc.status = 'partial';
                        }
                    }
                });
            }

            // Process Holly data
            if (hollyData && hollyData.doctors) {
                hollyData.doctors.forEach(doc => {
                    const norm = normalizeName(doc.name);
                    if (!norm) return;

                    // Try exact match first, then fuzzy by last name + first initial
                    let matchKey = norm;
                    if (!byNorm[matchKey]) {
                        const parts = norm.split(' ');
                        const last = parts[parts.length - 1];
                        const firstInit = parts[0] ? parts[0][0] : '';
                        for (const key of Object.keys(byNorm)) {
                            const kParts = key.split(' ');
                            const kLast = kParts[kParts.length - 1];
                            const kFirst = kParts[0] ? kParts[0][0] : '';
                            if (last === kLast && firstInit === kFirst) {
                                matchKey = key;
                                break;
                            }
                        }
                    }

                    if (!byNorm[matchKey]) byNorm[matchKey] = { name: doc.name, zocdoc: null, holly: null };
                    // Prefer longer/more formal name
                    if (doc.name.length > byNorm[matchKey].name.length) byNorm[matchKey].name = doc.name;

                    byNorm[matchKey].holly = {
                        name: doc.name,
                        overall_status: doc.overall_status,
                        total_locations: doc.total_locations,
                        locations_with_availability: doc.locations_with_availability,
                        next_available: doc.next_available,
                        locations: doc.locations || []
                    };
                });
            }

            // Build merged list
            return Object.values(byNorm).map(d => {
                // Compute overall status
                let overall = 'available';
                let issues = [];

                if (d.zocdoc) {
                    if (d.zocdoc.status === 'error') {
                        issues.push('zocdoc-error');
                    } else if (d.zocdoc.status === 'no_availability') {
                        issues.push('zocdoc-none');
                    }
                }

                if (d.holly) {
                    if (d.holly.overall_status === 'no_availability') {
                        issues.push('holly-none');
                    } else if (d.holly.overall_status === 'partial') {
                        issues.push('holly-partial');
                    }
                }

                if (issues.some(i => i.includes('error'))) {
                    overall = 'error';
                } else if (issues.some(i => i.includes('none')) && issues.length === countSources(d)) {
                    overall = 'no_availability';
                } else if (issues.length > 0) {
                    overall = 'has_gaps';
                }

                // Next available across all sources
                const nexts = [];
                if (d.zocdoc && d.zocdoc.next_available) nexts.push(d.zocdoc.next_available);
                if (d.holly && d.holly.next_available) nexts.push(d.holly.next_available);
                nexts.sort();

                return {
                    name: d.name,
                    overall: overall,
                    zocdoc: d.zocdoc,
                    holly: d.holly,
                    next_available: nexts[0] || null,
                    issues: issues
                };
            });
        }

        function countSources(d) {
            return (d.zocdoc ? 1 : 0) + (d.holly ? 1 : 0);
        }

        // --- Rendering ---
        function render() {
            renderStats();
            renderTable();
        }

        function renderStats() {
            const docs = getDocsForCurrentView();
            const total = docs.length;
            const allGood = docs.filter(d => getViewStatus(d) === 'available').length;
            const gaps = docs.filter(d => getViewStatus(d) === 'has_gaps').length;
            const none = docs.filter(d => getViewStatus(d) === 'no_availability').length;
            const errs = docs.filter(d => getViewStatus(d) === 'error').length;

            document.getElementById('stats-row').innerHTML = `
                <div class="stat-card"><div class="label">Total Providers</div><div class="value blue">${total}</div></div>
                <div class="stat-card"><div class="label">All Good</div><div class="value green">${allGood}</div></div>
                ${gaps > 0 ? `<div class="stat-card"><div class="label">Has Gaps</div><div class="value amber">${gaps}</div></div>` : ''}
                <div class="stat-card"><div class="label">No Availability</div><div class="value red">${none}</div></div>
                ${errs > 0 ? `<div class="stat-card"><div class="label">Errors</div><div class="value amber">${errs}</div></div>` : ''}
            `;
        }

        // Get doctors relevant to current tab
        function getDocsForCurrentView() {
            if (currentView === 'zocdoc') return mergedDoctors.filter(d => d.zocdoc);
            return mergedDoctors.filter(d => d.holly);
        }

        // Get status for current tab context
        function getViewStatus(d) {
            if (currentView === 'zocdoc') {
                if (!d.zocdoc) return 'not_listed';
                if (d.zocdoc.status === 'partial') return 'has_gaps';
                return d.zocdoc.status; // 'available', 'no_availability', 'error'
            } else {
                if (!d.holly) return 'not_listed';
                if (d.holly.overall_status === 'partial') return 'has_gaps';
                return d.holly.overall_status; // 'available', 'no_availability'
            }
        }

        function renderTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');

            // Only show doctors relevant to current tab
            let docs = getDocsForCurrentView();

            // Filter using tab-specific status
            docs = docs.filter(d => {
                const status = getViewStatus(d);
                if (currentFilter === 'all-good') return status === 'available';
                if (currentFilter === 'has-gaps') return status === 'has_gaps';
                if (currentFilter === 'no-availability') return status === 'no_availability';
                if (currentFilter === 'errors') return status === 'error';
                return true;
            });

            // Search
            if (currentSearch) {
                const q = currentSearch.toLowerCase();
                docs = docs.filter(d => {
                    if (d.name.toLowerCase().includes(q)) return true;
                    if (d.holly && d.holly.locations) {
                        return d.holly.locations.some(l =>
                            l.office_name.toLowerCase().includes(q) ||
                            l.address?.toLowerCase().includes(q)
                        );
                    }
                    return false;
                });
            }

            // Sort using tab-specific status
            docs.sort((a, b) => {
                const statusOrder = { error: 0, no_availability: 1, has_gaps: 2, available: 3 };
                let va, vb;
                if (sortCol === 'name') {
                    va = a.name.toLowerCase(); vb = b.name.toLowerCase();
                    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
                } else if (sortCol === 'status') {
                    va = statusOrder[getViewStatus(a)] ?? 9;
                    vb = statusOrder[getViewStatus(b)] ?? 9;
                } else if (sortCol === 'zocdoc') {
                    va = a.zocdoc ? (a.zocdoc.open_slots ?? -1) : -2;
                    vb = b.zocdoc ? (b.zocdoc.open_slots ?? -1) : -2;
                } else if (sortCol === 'holly') {
                    va = a.holly ? a.holly.locations_with_availability : -1;
                    vb = b.holly ? b.holly.locations_with_availability : -1;
                } else if (sortCol === 'next') {
                    va = a.next_available || 'zzzz'; vb = b.next_available || 'zzzz';
                    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
                }
                return sortAsc ? va - vb : vb - va;
            });

            // Render based on view
            if (currentView === 'zocdoc') {
                renderZocdocView(thead, tbody, docs);
            } else {
                renderHollyView(thead, tbody, docs);
            }
        }

        function sortArrow(col) {
            const active = sortCol === col;
            const arrow = active ? (sortAsc ? '▲' : '▼') : '▲';
            return `<span class="sort-arrow">${arrow}</span>`;
        }

        function renderUnifiedView(thead, tbody, docs) {
            thead.innerHTML = `<tr>
                <th style="width:30px"></th>
                <th onclick="window._sort('name')" ${sortCol==='name'?'class="sorted"':''}>Provider ${sortArrow('name')}</th>
                <th onclick="window._sort('status')" ${sortCol==='status'?'class="sorted"':''}>Status ${sortArrow('status')}</th>
                <th onclick="window._sort('zocdoc')" ${sortCol==='zocdoc'?'class="sorted"':''}>Zocdoc ${sortArrow('zocdoc')}</th>
                <th onclick="window._sort('holly')" ${sortCol==='holly'?'class="sorted"':''}>Holly ${sortArrow('holly')}</th>
                <th onclick="window._sort('next')" ${sortCol==='next'?'class="sorted"':''}>Next Available ${sortArrow('next')}</th>
            </tr>`;

            if (docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No providers match your filters.</td></tr>';
                return;
            }

            let html = '';
            docs.forEach((d, i) => {
                const rowClass = d.overall === 'has_gaps' || d.overall === 'no_availability' ? 'has-gap' : '';
                const hasHolly = d.holly && d.holly.locations && d.holly.locations.length > 0;

                html += `<tr class="${rowClass}" data-idx="${i}">
                    <td>${hasHolly ? `<button class="expand-btn" onclick="window._toggle(${i})">▶</button>` : ''}</td>
                    <td class="provider-name">${d.name}</td>
                    <td>${overallBadge(d.overall)}</td>
                    <td>${zocdocCell(d.zocdoc)}</td>
                    <td>${hollySummaryCell(d.holly)}</td>
                    <td>${d.next_available ? formatDate(d.next_available) : '<span style="color:#aaa">—</span>'}</td>
                </tr>`;

                // Expandable Holly detail row (hidden by default)
                if (hasHolly) {
                    html += `<tr class="detail-row" id="detail-${i}" style="display:none">
                        <td colspan="6">
                            <table>
                                <tr><th>Location</th><th>Status</th><th>New Patient</th><th>Return Patient</th><th>Next Available</th><th>Book</th></tr>
                                ${d.holly.locations.map(l => `<tr>
                                    <td><strong>${l.office_name}</strong></td>
                                    <td>${l.has_any_availability ? '<span class="badge available">Available</span>' : '<span class="badge no-availability">None</span>'}</td>
                                    <td>${l.new_patient_dates && l.new_patient_dates.length ? l.new_patient_dates.slice(0,3).map(formatDate).join(', ') : '—'}</td>
                                    <td>${l.return_patient_dates && l.return_patient_dates.length ? l.return_patient_dates.slice(0,3).map(formatDate).join(', ') : '—'}</td>
                                    <td>${l.next_available ? formatDate(l.next_available) : '—'}</td>
                                    <td><a href="${l.booking_url}" target="_blank" class="zocdoc-link">Book →</a></td>
                                </tr>`).join('')}
                            </table>
                        </td>
                    </tr>`;
                }
            });

            tbody.innerHTML = html;
        }

        function renderZocdocView(thead, tbody, docs) {
            thead.innerHTML = `<tr>
                <th style="width:30px"></th>
                <th onclick="window._sort('name')">Provider ${sortArrow('name')}</th>
                <th onclick="window._sort('status')">Status ${sortArrow('status')}</th>
                <th onclick="window._sort('zocdoc')">Locations / Slots ${sortArrow('zocdoc')}</th>
                <th onclick="window._sort('next')">Next Available ${sortArrow('next')}</th>
                <th>Link</th>
            </tr>`;

            const zDocs = docs;
            if (zDocs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No Zocdoc data available. Run the Zocdoc checker.</td></tr>';
                return;
            }

            let html = '';
            zDocs.forEach((d, i) => {
                const z = d.zocdoc;
                const hasLocs = z.locations && z.locations.length > 1;
                const statusClass = z.status !== 'available' ? 'has-gap' : '';

                // Location summary
                let locSummary = '';
                if (hasLocs) {
                    const colorClass = z.locations_available === z.locations_total ? 'green'
                        : z.locations_available === 0 ? 'red' : 'amber';
                    locSummary = `<span class="holly-summary"><span class="count ${colorClass}">${z.locations_available}/${z.locations_total}</span> locations, </span>`;
                }
                const slotColor = z.open_slots > 0 ? 'green' : 'red';

                html += `<tr class="${statusClass}">
                    <td>${hasLocs ? `<button class="expand-btn" onclick="window._toggleZ(${i})">▶</button>` : ''}</td>
                    <td class="provider-name"><a href="${z.url}" target="_blank">${z.name}</a></td>
                    <td>${statusBadge(z.status === 'partial' ? 'partial' : z.status)}</td>
                    <td>${locSummary}<span class="slots ${slotColor}">${z.open_slots != null ? z.open_slots : '?'}</span> <span style="font-size:11px;color:var(--text-secondary)">slots</span></td>
                    <td>${z.next_available ? formatDate(z.next_available) : '—'}</td>
                    <td><a href="${z.url}" target="_blank" class="zocdoc-link">View →</a></td>
                </tr>`;

                // Expandable location detail row
                if (hasLocs) {
                    html += `<tr class="detail-row" id="zocdoc-detail-${i}" style="display:none">
                        <td colspan="6">
                            <table>
                                <tr><th>Office</th><th>Slots</th><th>Next Available</th><th>Status</th></tr>
                                ${z.locations.map(l => {
                                    const officeName = phoneToOffice[l.phone] || l.phone || l.location_id.substring(0,18) + '…';
                                    return `<tr>
                                    <td>${l.has_availability ? '✅' : '❌'} <strong>${officeName}</strong></td>
                                    <td><span class="slots ${l.slots > 0 ? 'green' : 'red'}">${l.slots}</span></td>
                                    <td>${l.next_available ? formatDate(l.next_available) : '—'}</td>
                                    <td>${l.has_availability ? '<span class="badge available">Available</span>' : '<span class="badge no-availability">None</span>'}</td>
                                </tr>`;
                                }).join('')}
                            </table>
                        </td>
                    </tr>`;
                }
            });

            tbody.innerHTML = html;
        }

        function renderHollyView(thead, tbody, docs) {
            thead.innerHTML = `<tr>
                <th style="width:30px"></th>
                <th onclick="window._sort('name')">Provider ${sortArrow('name')}</th>
                <th onclick="window._sort('holly')">Locations ${sortArrow('holly')}</th>
                <th onclick="window._sort('status')">Status ${sortArrow('status')}</th>
                <th onclick="window._sort('next')">Next Available ${sortArrow('next')}</th>
            </tr>`;

            const hDocs = docs;
            if (hDocs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">No Holly data available. Run the Holly checker.</td></tr>';
                return;
            }

            let html = '';
            hDocs.forEach((d, i) => {
                const h = d.holly;
                const hasGap = h.overall_status !== 'available';

                html += `<tr class="${hasGap ? 'has-gap' : ''}">
                    <td><button class="expand-btn" onclick="window._toggleH(${i})">▶</button></td>
                    <td class="provider-name">${d.name}</td>
                    <td>${hollySummaryCell(h)}</td>
                    <td>${overallBadge(h.overall_status === 'partial' ? 'has_gaps' : h.overall_status)}</td>
                    <td>${h.next_available ? formatDate(h.next_available) : '—'}</td>
                </tr>`;

                html += `<tr class="detail-row" id="holly-detail-${i}" style="display:none">
                    <td colspan="5">
                        <table>
                            <tr><th>Location</th><th>New Patient Dates</th><th>Return Patient Dates</th><th>Book</th></tr>
                            ${h.locations.map(l => `<tr>
                                <td>${l.has_any_availability ? '✅' : '❌'} <strong>${l.office_name}</strong></td>
                                <td>${l.new_patient_dates && l.new_patient_dates.length ? l.new_patient_dates.slice(0,5).map(formatDate).join(', ') : '—'}</td>
                                <td>${l.return_patient_dates && l.return_patient_dates.length ? l.return_patient_dates.slice(0,5).map(formatDate).join(', ') : '—'}</td>
                                <td><a href="${l.booking_url}" target="_blank" class="zocdoc-link">Book →</a></td>
                            </tr>`).join('')}
                        </table>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // --- Helper renderers ---
        function overallBadge(status) {
            const map = {
                'available': '<span class="badge available">All Good</span>',
                'has_gaps': '<span class="badge partial">Has Gaps</span>',
                'no_availability': '<span class="badge no-availability">No Availability</span>',
                'error': '<span class="badge error">Error</span>'
            };
            return map[status] || status;
        }

        function statusBadge(status) {
            const map = {
                'available': '<span class="badge available">Available</span>',
                'partial': '<span class="badge partial">Partial</span>',
                'no_availability': '<span class="badge no-availability">None</span>',
                'error': '<span class="badge error">Error</span>'
            };
            return map[status] || status;
        }

        function zocdocCell(z) {
            if (!z) return '<span class="badge not-listed">Not Listed</span>';
            if (z.status === 'error') return '<span class="badge error">Error</span>';
            if (z.status === 'no_availability') return '<span class="badge no-availability">No Slots</span>';
            const slots = z.open_slots != null ? z.open_slots : '?';
            return `<div class="zocdoc-info">
                <span class="slots green">${slots}</span>
                <span class="meta">slots</span>
                ${z.url ? `<a href="${z.url}" target="_blank" class="zocdoc-link">View</a>` : ''}
            </div>`;
        }

        function hollySummaryCell(h) {
            if (!h) return '<span class="badge not-listed">Not Listed</span>';
            const total = h.total_locations || 0;
            const avail = h.locations_with_availability || 0;
            const colorClass = avail === total ? 'green' : avail === 0 ? 'red' : 'amber';
            let html = `<span class="holly-summary"><span class="count ${colorClass}">${avail}/${total}</span> locations</span>`;

            // Show compact location pills
            if (h.locations && h.locations.length <= 4) {
                html += '<div class="holly-locations" style="margin-top:3px">';
                h.locations.forEach(l => {
                    const cls = l.has_any_availability ? 'ok' : 'none';
                    html += `<span class="loc-pill ${cls}">${l.office_name}</span>`;
                });
                html += '</div>';
            }
            return html;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // --- Event Handlers ---
        window._sort = function(col) {
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = col === 'name' || col === 'next'; }
            renderTable();
        };

        window._toggle = function(idx) {
            const row = document.getElementById('detail-' + idx);
            const btn = row.previousElementSibling.querySelector('.expand-btn');
            if (row.style.display === 'none') {
                row.style.display = '';
                btn.classList.add('open');
            } else {
                row.style.display = 'none';
                btn.classList.remove('open');
            }
        };

        window._toggleH = function(idx) {
            const row = document.getElementById('holly-detail-' + idx);
            const btn = row.previousElementSibling.querySelector('.expand-btn');
            if (row.style.display === 'none') {
                row.style.display = '';
                btn.classList.add('open');
            } else {
                row.style.display = 'none';
                btn.classList.remove('open');
            }
        };

        window._toggleZ = function(idx) {
            const row = document.getElementById('zocdoc-detail-' + idx);
            const btn = row.previousElementSibling.querySelector('.expand-btn');
            if (row.style.display === 'none') {
                row.style.display = '';
                btn.classList.add('open');
            } else {
                row.style.display = 'none';
                btn.classList.remove('open');
            }
        };

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTable();
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTable();
        });

        // Source tabs
        document.querySelectorAll('.source-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentView = tab.dataset.view;
                // Reset filter to 'all' when switching tabs
                currentFilter = 'all';
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
                renderStats();
                renderTable();
            });
        });

        // --- Init ---
        loadData();
    })();
    </script>
</body>
</html>
